[project]
name = "notedump"
version = "0.1.0"
description = "Export Apple Notes (Mac or iPhone backup) to encrypted Parquet for a static, searchable DuckDB-WASM viewer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "apple-notes-parser>=0.2.0,<0.3",
    "pyarrow>=15",
    "cryptography>=42",
]

[project.scripts]
notedump = "notedump.cli:main"

[dependency-groups]
dev = ["pytest>=8", "duckdb>=1.1", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notedump"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
